# PROD profile: in-memory H2 from application.properties, the same as DEV (H2 console included).
# The DB starts empty on every start, so the schema must be created (update): validate would always fail.
spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health
